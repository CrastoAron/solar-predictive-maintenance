name: solarshield
description: SolarShield - solar maintenance and performance analysis app (Flutter port).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  flutter_local_notifications: ^22.3.3
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cleaned_real_telemetry.csv
